<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Atelier Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F6F7; --sheet:#FFFFFF; --ink:#171C22; --graphite:#67727E;
  --hair:#C9D1D6; --hair-soft:#E3E9EC; --tint:#EDF1F3;
  --redline:#C4432C;
  --open:#2F7355; --ask:#2B6098; --native:#9A6B14; --domestic:#6B5B95; --closed:#A33A2C;
  --f-ui:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161A; --sheet:#181D22; --ink:#E6EBEE; --graphite:#8D98A3;
  --hair:#2C343B; --hair-soft:#232A30; --tint:#1D2329;
  --redline:#E2705A;
  --open:#5FA783; --ask:#6BA3DC; --native:#C79B45; --domestic:#A392C9; --closed:#DE7C6B;
}}
:root[data-theme="dark"]{
  --paper:#12161A; --sheet:#181D22; --ink:#E6EBEE; --graphite:#8D98A3;
  --hair:#2C343B; --hair-soft:#232A30; --tint:#1D2329;
  --redline:#E2705A;
  --open:#5FA783; --ask:#6BA3DC; --native:#C79B45; --domestic:#A392C9; --closed:#DE7C6B;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.sheet{max-width:1180px;margin:0 auto;padding:26px 18px 80px}
.mark{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--graphite);display:block;margin-bottom:5px}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--graphite);font-size:13.5px;margin:0}

/* 표제란 */
.tblock{border:1.5px solid var(--ink);background:var(--sheet);
  display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr}
.tb{padding:12px 14px;border-right:1px solid var(--hair)}
.tb:last-child{border-right:0}
.tb-lead{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--ink);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.val{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.val small{font-size:11px;color:var(--graphite);font-weight:400}

/* 게이트 요약 — 이 페이지의 요점 */
.gates{margin-top:22px;display:grid;gap:1px;background:var(--hair);
  border:1px solid var(--hair);grid-template-columns:repeat(5,1fr)}
.gate{background:var(--sheet);padding:12px 14px;text-align:left;border:0;
  border-top:3px solid var(--g);cursor:pointer;font:inherit;color:inherit;display:block}
.gate[aria-pressed="true"]{background:var(--tint)}
.gate:focus-visible{outline:2px solid var(--redline);outline-offset:-2px}
.gate .n{font-family:var(--f-mono);font-size:24px;font-weight:600;color:var(--g);
  font-variant-numeric:tabular-nums;line-height:1.1}
.gate .t{font-size:13px;font-weight:600;margin-top:3px}
.gate .d{font-size:11.5px;color:var(--graphite);margin-top:2px;line-height:1.4}

/* 상황별 안내 */
.guide{margin-top:22px;border:1px solid var(--hair);background:var(--sheet)}
.guide-h{padding:11px 15px;border-bottom:1px solid var(--hair);display:flex;
  justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
.guide td{padding:9px 15px;border-bottom:1px solid var(--hair-soft);vertical-align:top}
.guide tr:last-child td{border-bottom:0}
.guide td:first-child{width:42%;color:var(--graphite)}
.guide b{color:var(--ink)}

/* 도구모음 */
.tools{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 11px;border:1px solid var(--hair);background:var(--sheet);color:var(--graphite);
  cursor:pointer;border-radius:0}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tint)}
.chip:focus-visible{outline:2px solid var(--redline);outline-offset:1px}
input[type=search]{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--hair);
  background:var(--sheet);color:var(--ink);min-width:190px;border-radius:0}
input[type=search]:focus-visible{outline:2px solid var(--redline);outline-offset:1px}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--graphite)}

/* 공고 일람 */
.rows{margin-top:12px;border-top:1.5px solid var(--ink)}
.row{border-bottom:1px solid var(--hair-soft);background:var(--sheet);
  display:grid;grid-template-columns:8px 1fr}
.stripe{background:var(--g)}
.rbody{padding:12px 15px;min-width:0}
.rtop{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rtitle{font-weight:600;font-size:15px;letter-spacing:-.005em}
.rfirm{color:var(--graphite);font-size:13px}
.gatechip{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border:1px solid var(--g);
  color:var(--g);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:7px;
  font-family:var(--f-mono);font-size:11.5px;color:var(--graphite)}
.meta .due{color:var(--redline);font-weight:600}
.why{margin-top:7px;font-size:13px;color:var(--graphite)}
.why b{color:var(--g)}
.act{margin-top:6px;font-size:13px;padding:7px 11px;background:var(--tint);
  border-left:3px solid var(--g)}
details{margin-top:9px}
summary{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--graphite);cursor:pointer;user-select:none}
summary:focus-visible{outline:2px solid var(--redline);outline-offset:2px}
.jd{display:grid;gap:15px;margin-top:11px;padding:14px 16px;background:var(--tint);
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.jd h4{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--graphite);margin:0 0 7px;font-weight:500}
.jd ul{margin:0;padding-left:17px;font-size:13.5px}
.jd li{margin-bottom:4px}
.jd p{margin:0;font-size:13.5px}
details.mail>summary{color:var(--ask);font-weight:600;margin-top:9px}
details.mail .jd{border-left:3px solid var(--ask)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--redline);text-decoration:none;
  border-bottom:1px solid currentColor}
.src:hover{background:var(--tint)}
.row.arch .rbody{padding:9px 15px}
.row.arch .rtitle{font-weight:500;font-size:14px}
.grouphead{background:var(--tint);border-bottom:1px solid var(--hair);padding:9px 15px;
  font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline}
.grouphead span{font-family:var(--f-mono);font-size:11.5px;color:var(--graphite);font-weight:400}
.urgent{margin:7px 0 0;font-weight:700;color:var(--redline);font-size:13.5px}
.thin{margin:9px 0 0;font-size:13px;color:var(--graphite);font-style:italic}
.empty{padding:34px 16px;text-align:center;color:var(--graphite);font-size:14px}

/* 미추적 */
.gap{margin-top:36px;border:1px dashed var(--hair);background:var(--sheet);padding:16px 18px}
.gaplist{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.gapitem{font-family:var(--f-mono);font-size:11.5px;color:var(--graphite);
  border:1px solid var(--hair-soft);padding:3px 8px}
.note{color:var(--graphite);font-size:13px;max-width:72ch;margin:6px 0 0}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--hair);
  font-family:var(--f-mono);font-size:11px;color:var(--graphite);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}
@media (max-width:760px){
  .tblock{grid-template-columns:1fr 1fr}
  .gates{grid-template-columns:1fr 1fr}
  .gate .d{display:none}
  .guide td:first-child{width:auto}
  h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="sheet">
  <header class="tblock">
    <div class="tb tb-lead">
      <h1>Atelier Radar</h1>
      <p class="sub">일본 · 한국 · 대만 건축설계 신입공채 및 인턴 추적</p>
    </div>
    <div class="tb"><span class="mark">대상 조건</span>
      <div class="val" style="font-size:14px">M.Arch · 2027.05 졸업</div>
      <div class="sub" style="font-size:12.5px">대만 국적 · 경력 0년 · 일본어 불가</div></div>
    <div class="tb"><span class="mark">추적 사무소</span>
      <div class="val" id="k-off">–</div></div>
    <div class="tb"><span class="mark">수집 공고</span>
      <div class="val" id="k-post">–</div></div>
    <div class="tb"><span class="mark">최종 갱신</span>
      <div class="val" id="k-time" style="font-size:13px">–</div></div>
  </header>

  <section class="gates" id="gates" role="group" aria-label="지원 가능 여부로 거르기"></section>

  <section class="guide">
    <div class="guide-h"><h2>지금 뭘 봐야 하나</h2>
      <span class="mark" style="margin:0">상황별 안내</span></div>
    <table><tbody id="guide"></tbody></table>
  </section>

  <div class="tools">
    <div style="display:flex;gap:6px" role="group" aria-label="국가">
      <button class="chip" data-c="all" aria-pressed="true">전체</button>
      <button class="chip" data-c="KR" aria-pressed="false">🇰🇷 한국</button>
      <button class="chip" data-c="JP" aria-pressed="false">🇯🇵 일본</button>
      <button class="chip" data-c="TW" aria-pressed="false">🇹🇼 대만</button>
    </div>
    <div style="display:flex;gap:6px" role="group" aria-label="진행 상태">
      <button class="chip" data-v="live" aria-pressed="true">진행중</button>
      <button class="chip" data-v="past" aria-pressed="false">지난 공고</button>
    </div>
    <input type="search" id="q" placeholder="회사·직무 검색" aria-label="검색">
    <span class="count" id="count"></span>
  </div>

  <div class="rows" id="rows"></div>

  <section class="gap">
    <span class="mark" id="gap-h">아직 추적하지 못하는 사무소</span>
    <p class="note">채용 페이지 주소를 못 찾았거나, 자바스크립트로 그려서 본문을 읽을 수 없는 곳이다.
      여기 있는 동안은 공고가 올라와도 잡히지 않는다.</p>
    <div class="gaplist" id="gaps"></div>
  </section>

  <footer><span>모든 항목은 채용 페이지 원문에서 확인한 것만 싣는다</span>
    <span>확인되지 않은 항목은 추정하지 않고 비워 둔다</span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
