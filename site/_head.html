<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 개인 구직 현황판이다. 검색엔진에 올라갈 이유가 없다. -->
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="일본·한국·대만 건축설계 신입공채/인턴 추적">
<title>Atelier Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F6F7; --sheet:#FFFFFF; --ink:#171C22; --graphite:#67727E;
  --hair:#C9D1D6; --hair-soft:#E3E9EC;
  --redline:#C4432C; --open:#2F7355; --hold:#9A6B14; --closed:#8B939C;
  --tint:#EDF1F3;
  --f-ui:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12161A; --sheet:#181D22; --ink:#E6EBEE; --graphite:#8D98A3;
    --hair:#2C343B; --hair-soft:#232A30;
    --redline:#E2705A; --open:#5FA783; --hold:#C79B45; --closed:#6E7880;
    --tint:#1D2329;
  }
}
:root[data-theme="dark"]{
  --paper:#12161A; --sheet:#181D22; --ink:#E6EBEE; --graphite:#8D98A3;
  --hair:#2C343B; --hair-soft:#232A30;
  --redline:#E2705A; --open:#5FA783; --hold:#C79B45; --closed:#6E7880;
  --tint:#1D2329;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.sheet{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

/* ── title block: 실제 도면 표제란처럼 격자 ── */
.titleblock{border:1.5px solid var(--ink);background:var(--sheet);
  display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;}
.tb{padding:12px 14px;border-right:1px solid var(--hair)}
.tb:last-child{border-right:0}
.tb-lead{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--ink);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
.mark{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--graphite);display:block;margin-bottom:5px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--graphite);font-size:13.5px;margin:0}
.val{font-family:var(--f-mono);font-size:16px;font-weight:500;
  font-variant-numeric:tabular-nums}
.val small{font-size:11px;color:var(--graphite);font-weight:400}

/* ── 커버리지 게이지 ── */
.coverage{margin-top:26px;display:grid;gap:1px;background:var(--hair);
  border:1px solid var(--hair);grid-template-columns:repeat(3,1fr)}
.cov{background:var(--sheet);padding:13px 15px}
.cov-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cov-name{font-weight:600;font-size:14px}
.cov-num{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;
  color:var(--graphite)}
.bar{height:5px;background:var(--hair-soft);margin-top:9px;display:flex;gap:1px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--open)} .bar .b-no{background:var(--closed);opacity:.42}

/* ── schedule: 창호일람표 같은 표 ── */
.schedhead{display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin:34px 0 0;flex-wrap:wrap}
h2{font-size:15px;font-weight:600;letter-spacing:.01em;margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 10px;border:1px solid var(--hair);
  background:var(--sheet);color:var(--graphite);cursor:pointer;border-radius:0}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tint)}
.chip:focus-visible{outline:2px solid var(--redline);outline-offset:1px}

.rows{margin-top:12px;border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:9px 1fr;border-bottom:1px solid var(--hair-soft);
  background:var(--sheet)}
.stripe{background:var(--closed)}
.row[data-v="fit"] .stripe{background:var(--open)}
.row[data-v="conditional"] .stripe{background:var(--hold)}
.row[data-v="blocked"] .stripe{background:var(--closed)}
.row[data-v="expired"] .stripe{background:var(--redline)}
.body{padding:13px 16px;min-width:0}
.r1{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.title{font-weight:600;font-size:15px;letter-spacing:-.005em}
.firm{color:var(--graphite);font-size:13px}
.r2{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border:1px solid var(--hair);
  color:var(--graphite);white-space:nowrap}
.tag.block{border-color:var(--closed);color:var(--closed)}
.tag.warn{border-color:var(--hold);color:var(--hold)}
.tag.good{border-color:var(--open);color:var(--open)}
.tag.due{border-color:var(--redline);color:var(--redline);font-weight:600}
.sum{color:var(--graphite);font-size:13.5px;margin-top:8px;max-width:74ch}
details{margin-top:9px}
summary{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--graphite);cursor:pointer}
summary:focus-visible{outline:2px solid var(--redline);outline-offset:2px}
.jd{display:grid;gap:14px;margin-top:11px;padding:13px 15px;background:var(--tint);
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.jd h4{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--graphite);margin:0 0 6px;font-weight:500}
.jd ul{margin:0;padding-left:16px;font-size:13.5px}
.jd li{margin-bottom:3px}
.jd p{margin:0;font-size:13.5px}
a.src{font-family:var(--f-mono);font-size:11.5px;color:var(--redline);
  text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
a.src:hover{background:var(--tint)}

/* ── 미추적 목록 ── */
.gap{margin-top:38px;border:1px dashed var(--hair);background:var(--sheet);padding:16px 18px}
.gaplist{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.gapitem{font-family:var(--f-mono);font-size:11.5px;color:var(--graphite);
  border:1px solid var(--hair-soft);padding:3px 8px}
.note{color:var(--graphite);font-size:13px;max-width:70ch;margin:6px 0 0}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--hair);
  font-family:var(--f-mono);font-size:11px;color:var(--graphite);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none}
@media (max-width:720px){
  .titleblock{grid-template-columns:1fr 1fr}
  .coverage{grid-template-columns:1fr}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
