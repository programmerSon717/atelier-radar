name: atelier-radar

on:
  schedule:
    # 30분마다 변경 감지 (UTC). GitHub Actions cron 은 정확하지 않고 몇 분 밀릴 수 있다.
    - cron: "*/30 * * * *"
    # 매주 월요일 00:00 UTC = 한국/일본 09:00 — 전체 훑기
    - cron: "0 0 * * 1"
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      sweep:
        description: "전체 훑기(sweep)로 실행"
        type: boolean
        default: false

concurrency:
  group: radar              # 이전 실행이 아직 돌면 겹치지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 이미 보낸 공고를 기억해야 같은 걸 두 번 안 보낸다.
      # 러너는 매번 새 머신이라 캐시로 store/ 를 넘긴다.
      - name: 이전 상태 복원
        uses: actions/cache@v4
        with:
          path: store
          key: radar-store-${{ github.run_id }}
          restore-keys: |
            radar-store-

      - name: 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_TOPIC_KR: ${{ secrets.TELEGRAM_TOPIC_KR }}
          TELEGRAM_TOPIC_JP: ${{ secrets.TELEGRAM_TOPIC_JP }}
          TELEGRAM_TOPIC_TW: ${{ secrets.TELEGRAM_TOPIC_TW }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 1" ] || [ "${{ inputs.sweep }}" = "true" ]; then
            echo "::notice::주간 전체 훑기"
            python -m src.main --sweep
          else
            python -m src.main
          fi
