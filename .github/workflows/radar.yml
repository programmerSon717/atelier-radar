name: atelier-radar

on:
  schedule:
    # 10분마다 변경 감지. Actions cron 은 정확하지 않아 몇 분씩 밀린다.
    - cron: "*/10 * * * *"
    # 매주 월요일 00:00 UTC = 한국/일본 09:00 — 전체 훑기
    - cron: "0 0 * * 1"
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      sweep:
        description: "전체 훑기(sweep)로 실행"
        type: boolean
        default: false

concurrency:
  group: radar              # 이전 실행이 아직 돌면 겹치지 않게
  cancel-in-progress: false

permissions:
  contents: read
  pages: write              # GitHub Pages 배포용
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # JS 렌더링이 붙어 느려졌다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # JS 로 그리는 채용페이지(한국 ATS, 대만 사무소)를 읽으려면 실제 브라우저가 필요하다
      - name: 브라우저 설치
        run: python -m playwright install --with-deps chromium

      # 이미 보낸 공고를 기억해야 같은 걸 두 번 안 보낸다.
      # 러너는 매번 새 머신이라 캐시로 store/ 를 넘긴다.
      - name: 이전 상태 복원
        uses: actions/cache@v4
        with:
          path: store
          key: radar-store-${{ github.run_id }}
          restore-keys: |
            radar-store-

      - name: 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_TOPIC_KR: ${{ secrets.TELEGRAM_TOPIC_KR }}
          TELEGRAM_TOPIC_JP: ${{ secrets.TELEGRAM_TOPIC_JP }}
          TELEGRAM_TOPIC_TW: ${{ secrets.TELEGRAM_TOPIC_TW }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 1" ] || [ "${{ inputs.sweep }}" = "true" ]; then
            echo "::notice::주간 전체 훑기"
            python -m src.main --sweep
          else
            python -m src.main
          fi

      # 실행 결과로 정적 사이트를 다시 만든다 → 링크만 있으면 누구나 본다
      - name: 사이트 생성
        run: python tools/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
