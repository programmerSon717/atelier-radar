name: atelier-radar

on:
  # 코드를 고쳐 올리면 바로 다시 만들어 배포한다. GitHub 의 10분 cron 은 실제로는
  # 몇 시간에 한 번만 돌아서, 고친 판정이 사이트에 언제 반영될지 알 수 없었다.
  push:
    branches: [main]
  schedule:
    # 10분마다 변경 감지. Actions cron 은 정확하지 않아 몇 분씩 밀린다.
    - cron: "*/10 * * * *"
    # 매주 월요일 00:00 UTC = 한국/일본 09:00 — 전체 훑기
    - cron: "0 0 * * 1"
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      sweep:
        description: "전체 훑기(sweep)로 실행"
        type: boolean
        default: false
      resend:
        description: "사이트에 떠 있는 공고를 텔레그램에 전부 다시 보낸다"
        type: boolean
        default: false

concurrency:
  group: radar              # 이전 실행이 아직 돌면 겹치지 않게
  # 다만 코드를 고쳐 올린 경우에는 돌던 수집을 끊고 먼저 배포한다.
  # 수집이 20분 걸리는 동안 고친 판정이 사이트에 못 올라가는 일이 실제로 있었다.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pages: write              # GitHub Pages 배포용
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # JS 렌더링이 붙어 느려졌다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # JS 로 그리는 채용페이지(한국 ATS, 대만 사무소)를 읽으려면 실제 브라우저가 필요하다
      - name: 브라우저 설치
        if: github.event_name != 'push' && inputs.resend != true   # 수집을 안 하면 브라우저도 필요 없다
        run: python -m playwright install --with-deps chromium

      # 이미 보낸 공고를 기억해야 같은 걸 두 번 안 보낸다.
      # 러너는 매번 새 머신이라 캐시로 store/ 를 넘긴다.
      - name: 이전 상태 복원
        uses: actions/cache@v4
        with:
          path: store
          key: radar-store-${{ github.run_id }}
          restore-keys: |
            radar-store-

      # 판정·화면 코드를 고친 배포는 수집이 필요 없다. 저장분을 그대로 다시 그리면 된다.
      # 새 공고를 찾는 건 cron 과 주간 스윕의 몫이다.
      - name: 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_TOPIC_KR: ${{ secrets.TELEGRAM_TOPIC_KR }}
          TELEGRAM_TOPIC_JP: ${{ secrets.TELEGRAM_TOPIC_JP }}
          TELEGRAM_TOPIC_TW: ${{ secrets.TELEGRAM_TOPIC_TW }}
          TELEGRAM_TOPIC_OPEN: ${{ secrets.TELEGRAM_TOPIC_OPEN }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_SCHOOL: ${{ secrets.CANDIDATE_SCHOOL }}
        if: github.event_name != 'push' && inputs.resend != true
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 1" ] || [ "${{ inputs.sweep }}" = "true" ]; then
            echo "::notice::주간 전체 훑기"
            python -m src.main --sweep
          else
            python -m src.main
          fi

      # 공고를 세 언어로 만들어 둔다. 화면은 저장분으로 그려지므로 번역도 저장분에 넣는다.
      # 내용이 바뀐 공고만 부른다 (원문 해시 비교).
      # 푸시 배포에서도 돌린다. 안 돌리면 클라우드 저장분에 번역이 영영 안 생겨서
      # 언어를 바꿔도 공고는 원문 그대로 나온다. 다만 배포가 늦어지지 않게 개수를 끊는다.
      - name: 번역 (한국어·영어·번체중문)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/translate_postings.py --limit 80 || true

      # 사이트에 떠 있는 공고를 텔레그램에 전부 다시 보낸다 (수동 실행 전용).
      # 저장분은 러너 캐시에 있으므로 여기서 돌려야 클라우드의 실제 목록이 나간다.
      - name: 전부 다시 보내기
        if: inputs.resend == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_TOPIC_KR: ${{ secrets.TELEGRAM_TOPIC_KR }}
          TELEGRAM_TOPIC_JP: ${{ secrets.TELEGRAM_TOPIC_JP }}
          TELEGRAM_TOPIC_TW: ${{ secrets.TELEGRAM_TOPIC_TW }}
          TELEGRAM_TOPIC_OPEN: ${{ secrets.TELEGRAM_TOPIC_OPEN }}
        run: python tools/send_all.py

      # 실행 결과로 정적 사이트를 다시 만든다 → 링크만 있으면 누구나 본다
      # 이 단계가 메일 초안에서 이름·학교를 가린다. 값을 못 받으면 초안을 통째로 뺀다.
      - name: 사이트 생성
        env:
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_SCHOOL: ${{ secrets.CANDIDATE_SCHOOL }}
        run: python tools/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
