# 업계 연봉 참고 범위
#
# ★ 이건 **회사별 실제 급여가 아니다.** 공고 대부분이 "면접 후 결정 / 회사 내규"라
#   회사값을 알 수 없어서, 업계에서 통용되는 대략적인 범위를 참고용으로만 붙인다.
#   화면에도 "업계 참고치 · 회사 값 아님"으로 표시한다.
#   공고에 금액이 적혀 있으면 그게 우선이고 이 표는 보조로만 쓴다.
#
# 근거: 각국 건축설계 업계에서 통용되는 신입 초임 범위(2025~2026 기준 추정).
#       정확도가 필요하면 크레딧잡·잡플래닛·OpenWork·104 를 직접 확인할 것.
meta:
  updated: "2026-09"
  disclaimer: "업계 참고 범위 — 특정 회사의 실제 급여가 아님"

