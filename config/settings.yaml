# ─── 비용 3단 구조 ───
# 채용 정보는 초 단위로 안 바뀐다. 그래서 매 주기마다 LLM을 돌리지 않는다.
#   tier1 watch   : 채용페이지 HTTP GET → 텍스트 해시 비교. LLM 안 씀 = $0
#   tier2 extract : 해시가 바뀐 오피스의 페이지 텍스트만 Gemini 로 구조화
#   tier3 sweep   : 주 1회 전체 훑기 (해시 무시하고 전부 추출)

# 무료 티어 한도는 **모델마다 따로** 걸린다 (모델당 하루 20회 수준).
# 앞에서부터 쓰다가 그 모델이 오늘치를 다 쓰면 다음 모델로 자동 전환한다.
# 12개 × 20회 ≈ 하루 240회. 평소 필요량(0~5회)과 주간 스윕(43회)에 충분하다.
model: gemini-3.5-flash-lite      # 기본
models:
  # lite 계열 먼저 — 추출 작업엔 충분하고 한도가 넉넉하다
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
  - gemini-flash-lite-latest
  - gemini-3.1-flash-lite-preview
  # 그다음 일반 flash
  - gemini-3-flash-preview
  - gemini-3.8-flash
  - gemini-3.7-flash
  - gemini-3.6-flash
  - gemini-3.5-flash
  - gemini-flash-latest

watch:
  interval_minutes: 30
  timeout_seconds: 20
  max_parallel: 12        # HTTP 동시 요청 수

research:
  max_parallel: 2              # Gemini 동시 호출 수
  min_seconds_between_calls: 6 # 무료 티어 분당 한도(429) 회피용 간격
  max_retries: 3               # 429/503 은 기다리면 대개 풀린다
  retry_base_seconds: 8

sweep:
  weekday: 0              # 0=월요일
  hour: 9                 # 로컬 시각

locale: ko                # ko | zh_TW — 로그·내부용

telegram:
  # 봇을 읽는 사람은 대만 사람이다. 사이트 locale 과 상관없이 번체중문으로 보낸다.
  # 문구는 config/locales/zh_TW.yaml (사이트 화면과 같은 파일) 에서 온다.
  locale: zh_TW           # ko | en | zh_TW

outreach:
  # '문의 필요' 판정이 난 공고에 대해 실제로 보낼 수 있는 메일 초안을 같이 만든다.
  # 연락처·그 사무소 프로젝트·본인 이력을 엮어서 쓴다.
  enabled: true
  # 채용페이지에 프로젝트가 없으면 뉴스에서 근거를 찾아온다.
  # 이게 없으면 "프로젝트 목록이 기재되어 있지 않으나" 로 시작하는 메일이 나간다.
  news_lookup: true
  news_limit: 5

filter:
  # 후보자는 정규직 경력 0년이다. 경력을 요구하는 공고는 지원 자체가 안 되므로
  # 라벨만 붙여 보내지 않고 아예 내보내지 않는다.
  new_grad_only: true
  # 이름 모를 사무소 공고는 내보내지 않는다. 우리가 고른 사무소이거나, 설계로
  # 이름났다는 근거(수상·현상설계·미술관 등)가 공고에 있어야 한다.
  known_firms_only: true
  # 설계직이 아닌 자리(영업·시공관리·감리)와 시공사 공고는 아예 내보내지 않는다
  drop_low_fit: true
  # "학력무관" 이라고 적힌 공고는 보내지 않는다. 건축 석사가 갈 자리가 아니고,
  # 실제로는 도면 대행·시공 보조 인력 모집인 경우가 대부분이다.
  drop_no_degree: true
  # 인허가 대행·단기 알바처럼 설계 역량을 쌓을 수 없는 곳은 보내지 않는다.
  # 인상이 아니라 공고에 적힌 근거가 있을 때만 제외한다.
  drop_weak_firms: true
  # 언어·비자처럼 '준비하면 넘는' 조건은 그대로 보여준다 (라벨로 표시)
  drop_mismatches: false
